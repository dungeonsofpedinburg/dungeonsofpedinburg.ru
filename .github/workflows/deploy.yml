name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

  # Разрешает запуск вручную из вкладки Actions
  workflow_dispatch:

# Устанавливаем права на запись для GITHUB_TOKEN, чтобы деплоить на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Гарантируем, что только один деплой запущен за раз
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Добавляем обязательное указание окружения для GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Обновили до стабильной 22-й версии
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment # Указываем ID, чтобы связать с URL выше
        uses: actions/deploy-pages@v4